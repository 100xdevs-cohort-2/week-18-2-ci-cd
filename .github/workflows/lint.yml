name: Build Succeed on PR

on:
  pullrequest:
    branches: -master

job:
  build:
    name: Build the project
    run: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build
