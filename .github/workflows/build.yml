name : Build on PR

on:
    push:
        branches:
            - master
            - My-Changes

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Generate Prisma Client
              run: npm run db:generate 

            - name: Build
              run : npm run build
