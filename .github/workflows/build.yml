name: Build on PR

on:
  pull_request:
    branches:
      - master
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -uses: action/checkout@v3
      -name: Use Node.js
       uses: action/setup-node@v3
       with:
        node-version: '20'

      -name: Install dependencies
       run: npm install

      -name: Generate prisma client  
       run: npm run db:generate

      -name: Run build 
       run: npm run dev
       